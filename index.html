<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>線上四維堂</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
/* Layout: a 4:3 SFC-era screen with JRPG blue message windows inside it; single dark look by design */
:root{
  --bg:#0e0f1e; --win-a:#3048c8; --win-b:#101a68; --win-line:#f4f4f8; --win-shade:#060a30;
  --ink:#f4f4f8; --dim:#aab0d8; --gold:#f8d048; --red:#e85a6a;
  --px:'DotGothic16', 'Courier New', monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--px);
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:14px;box-sizing:border-box;
  background-image:radial-gradient(circle at 50% 10%, #1d2150 0%, var(--bg) 65%)}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:12px;align-items:center}
.screen{position:relative;width:min(100%, calc((100dvh - 200px) * 4 / 3));min-width:min(100%,300px);max-width:100%;aspect-ratio:4/3;background:#000;overflow:hidden;
  border-radius:10px;box-shadow:0 0 0 6px #23243c, 0 0 0 9px #4a4c70, 0 20px 50px rgba(0,0,0,.7)}
canvas#game{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges;cursor:pointer;touch-action:none}
.crt{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(180deg,rgba(0,0,0,.16) 0 1px,transparent 1px 3px);mix-blend-mode:multiply}
.crt::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 60%,rgba(0,0,0,.35) 100%)}
.win{background:linear-gradient(180deg,var(--win-a),var(--win-b));color:var(--ink);border:3px solid var(--win-line);border-radius:6px;
  box-shadow:0 0 0 3px var(--win-shade), inset 0 0 0 2px var(--win-shade), 4px 4px 0 3px rgba(0,0,0,.45);text-shadow:2px 2px 0 var(--win-shade)}
.hud{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}
.chip{padding:2px 10px;font-size:clamp(11px,1.8vw,16px);white-space:nowrap}
.chip b{color:var(--gold);font-weight:400}
.dlg{position:absolute;left:10px;right:10px;bottom:10px;padding:10px 16px 14px;font-size:clamp(13px,2.2vw,20px);line-height:1.7;white-space:pre-line;min-height:4.4em}
.dlg.top{top:46px;bottom:auto}
.dlg[hidden]{display:none!important}
.dlg .who{display:block;color:var(--gold);margin-bottom:2px}
.dlg .more{position:absolute;right:14px;bottom:6px;animation:bob .6s steps(2) infinite}
@keyframes bob{50%{transform:translateY(3px)}}
.loccard{position:absolute;left:50%;top:22%;transform:translateX(-50%);padding:8px 24px;font-size:clamp(14px,2.6vw,24px);white-space:nowrap;transition:opacity .4s}
.loccard[hidden]{display:none!important}
.title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  background:linear-gradient(180deg,rgba(8,10,40,.55),rgba(8,10,40,.85));text-align:center;cursor:pointer;padding:16px}
.title[hidden]{display:none!important}
.title .eyebrow{color:var(--gold);font-size:clamp(11px,2vw,16px);letter-spacing:4px;text-shadow:2px 2px 0 #000}
.title h1{margin:0;font-weight:400;font-size:clamp(34px,8vw,76px);line-height:1.1;color:#fff;letter-spacing:6px;
  text-shadow:3px 0 0 #2038a8,-3px 0 0 #2038a8,0 3px 0 #2038a8,0 -3px 0 #2038a8,6px 6px 0 #000}
.title .sub{font-size:clamp(14px,2.6vw,22px);color:#fff;text-shadow:2px 2px 0 #000;letter-spacing:6px}
.menu{margin-top:14px;padding:10px 22px;display:flex;flex-direction:column;gap:6px;text-align:left}
.menu button{all:unset;cursor:pointer;font-family:var(--px);font-size:clamp(14px,2.4vw,20px);color:var(--ink);padding-left:1.4em;position:relative}
.menu button.sel::before{content:"▶";position:absolute;left:0;animation:blink .6s steps(2) infinite}
.menu button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.push{color:#fff;font-size:clamp(12px,2vw,16px);letter-spacing:4px;animation:blink 1s steps(2) infinite;text-shadow:2px 2px 0 #000}
.copy{position:absolute;bottom:10px;font-size:clamp(10px,1.6vw,13px);color:var(--dim);letter-spacing:2px}
@keyframes blink{50%{opacity:0}}
.bar{width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.hint{font-size:14px;color:var(--dim);line-height:1.7}
.hint kbd{font-family:var(--px);background:#1d2150;border:1px solid #4a4c70;padding:0 6px;color:var(--ink)}
.toggles{display:flex;gap:8px}
.tog{font-family:var(--px);font-size:14px;padding:4px 10px;cursor:pointer}
.touch{display:none;gap:28px;align-items:center}
@media (pointer:coarse){.touch{display:flex}.kb{display:none}}
.pad{display:grid;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(3,54px);gap:4px}
.pad button{font-family:var(--px);font-size:18px;color:var(--ink);background:#23243c;border:3px solid #4a4c70;border-radius:6px;touch-action:none;user-select:none;-webkit-user-select:none}
.pad button.on,.pad button:active{background:#3048c8}
.pad .u{grid-column:2;grid-row:1}.pad .l{grid-column:1;grid-row:2}.pad .r{grid-column:3;grid-row:2}.pad .d{grid-column:2;grid-row:3}
.ab{display:flex;gap:12px;transform:rotate(-18deg)}
.ab button{width:60px;height:60px;border-radius:50%;font-family:var(--px);font-size:18px;color:#fff;border:3px solid #23243c;touch-action:none}
.ab .a{background:#c8304a}.ab .b{background:#d8a028}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.note{font-size:13px;color:var(--dim);line-height:1.7;margin:0;width:100%}

#modal{position:fixed;inset:0;z-index:30;background:rgba(4,6,24,.82);display:flex;align-items:center;justify-content:center;
  padding:max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}
#modal[hidden]{display:none!important}
.card{width:min(860px,100%);max-height:100%;overflow:auto;padding:18px;display:grid;grid-template-columns:1.5fr 1fr;gap:18px}
@media (max-width:640px){.card{grid-template-columns:1fr}}
.frame{background:#0a0c28;padding:6px;border:3px solid var(--win-line);border-radius:4px;align-self:start}
.frame img,.frame canvas{width:100%;display:block;aspect-ratio:3/2;object-fit:cover}
.frame canvas{image-rendering:pixelated;image-rendering:crisp-edges}
.info{display:flex;flex-direction:column;gap:10px;min-width:0}
.info .no{font-size:14px;color:var(--gold)}
.info h2{margin:0;font-weight:400;font-size:clamp(20px,3vw,28px);line-height:1.3;text-wrap:balance}
.info .meta{font-size:14px;color:var(--dim)}
.info p{margin:0;font-size:16px;line-height:1.8}
.nav{grid-column:1/-1;display:flex;gap:18px;justify-content:center;flex-wrap:wrap;border-top:2px solid rgba(244,244,248,.4);padding-top:12px}
.nav button{all:unset;cursor:pointer;font-family:var(--px);font-size:17px;padding-left:1.3em;position:relative}
.nav button:hover::before,.nav button:focus-visible::before{content:"▶";position:absolute;left:0}
.nav button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

#panel{position:fixed;inset:0;z-index:31;background:rgba(4,6,24,.82);display:flex;align-items:center;justify-content:center;
  padding:max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}
#panel[hidden]{display:none!important}
.pcard{width:min(920px,100%);max-height:100%;overflow:auto;padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.phead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.phead h2{margin:0;font-weight:400;font-size:clamp(20px,3vw,26px);color:var(--gold)}
.phead .sub{font-size:14px;color:var(--dim)}
.pclose{all:unset;cursor:pointer;font-family:var(--px);font-size:16px;padding-left:1.3em;position:relative}
.pclose:hover::before,.pclose:focus-visible::before{content:"▶";position:absolute;left:0}
.pclose:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
form.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;align-items:end}
form.f label{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--dim);min-width:0}
form.f .wide{grid-column:1/-1}
form.f input,form.f textarea,form.f select{font-family:var(--px);font-size:16px;color:#1b1d3a;background:#f4f4f8;border:2px solid #0a0c28;border-radius:3px;padding:6px 8px;min-width:0;width:100%;box-sizing:border-box}
form.f textarea{resize:vertical;min-height:72px;line-height:1.6}
form.f input:focus-visible,form.f textarea:focus-visible,form.f select:focus-visible{outline:3px solid var(--gold);outline-offset:1px}
.go{font-family:var(--px);font-size:17px;color:#fff;background:#c8304a;border:3px solid #f4f4f8;border-radius:4px;padding:8px 18px;cursor:pointer;box-shadow:0 3px 0 #6e1424}
.go:hover{background:#d84058}.go:disabled{opacity:.5;cursor:default}
.msg{font-size:14px;color:var(--gold);min-height:1.4em}
.tag{display:inline-block;font-size:11px;background:#0a0c28;color:var(--dim);padding:0 5px;border-radius:2px;margin-left:6px;vertical-align:middle}
/* board */
.cork{background-color:#b8854f;background-image:radial-gradient(rgba(90,50,20,.35) 1px,transparent 1.4px),radial-gradient(rgba(255,220,170,.25) 1px,transparent 1.4px);background-size:7px 7px,11px 11px;
  border:8px solid #6b3f22;border-radius:4px;box-shadow:inset 0 0 0 2px #40230f;padding:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px;max-height:46vh;overflow:auto}
.sticky{position:relative;color:#33270e;padding:16px 12px 10px;font-size:15px;line-height:1.6;box-shadow:2px 4px 0 rgba(40,20,5,.35);transform:rotate(var(--r,0deg));text-shadow:none;min-width:0;overflow-wrap:anywhere}
.sticky::before{content:"";position:absolute;top:-5px;left:50%;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:#c8304a;box-shadow:inset -2px -2px 0 #7a1424}
.sticky .by{display:block;margin-top:8px;font-size:12px;color:#6b5a32}
.c-y{background:#fff07a}.c-p{background:#ffc2d4}.c-b{background:#b8e2ff}.c-g{background:#c8f2a8}
.swatch{display:flex;gap:8px}.swatch label{flex-direction:row;align-items:center;gap:4px}
.swatch input{width:auto}
/* guestbook */
.book{background:#f4ead2;color:#3a2d10;text-shadow:none;border:6px solid #6b3f22;border-radius:4px;display:grid;grid-template-columns:1fr 1fr;max-height:44vh;overflow:auto;box-shadow:inset 0 0 0 2px #c9b48c}
@media (max-width:640px){.book{grid-template-columns:1fr}}
.book ol{list-style:none;margin:0;padding:12px 18px;background-image:repeating-linear-gradient(180deg,transparent 0 33px,#d8c9a4 33px 34px)}
.book ol:first-child{border-right:2px solid #c9b48c}
.book li{min-height:34px;font-size:15px;line-height:34px;display:flex;gap:10px;flex-wrap:wrap;overflow-wrap:anywhere}
.book li .n{color:#7a1f2a}.book li .d{color:#6b5a32;font-size:13px}
/* postcard */
.pc{display:grid;grid-template-columns:1fr 1.2fr;gap:16px}
@media (max-width:700px){.pc{grid-template-columns:1fr}}
.pcfront{background:#fbf6ea;padding:8px;border-radius:3px;box-shadow:3px 4px 0 rgba(0,0,0,.4);position:relative;align-self:start}
.pcfront img{width:100%;aspect-ratio:3/2;object-fit:cover;display:block}
.pcfront img.px{image-rendering:pixelated;image-rendering:crisp-edges}
.stamp{position:absolute;right:16px;top:16px;width:58px;height:66px;background:#fbf6ea;border:3px dotted #c8304a;color:#0D4B3C;font-size:11px;line-height:1.2;text-align:center;display:flex;flex-direction:column;justify-content:center;text-shadow:none}
.stamp b{font-weight:400;font-size:16px;color:#c8304a}
.postmark{position:absolute;left:14px;bottom:14px;width:84px;height:84px;border:3px solid rgba(20,40,120,.8);border-radius:50%;color:rgba(20,40,120,.9);font-size:11px;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.3;transform:rotate(-14deg);text-shadow:none;background:rgba(251,246,234,.55)}
.postmark[hidden]{display:none!important}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.modes{grid-template-columns:1fr}}
.mode{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:2px solid rgba(244,244,248,.45);border-radius:4px;cursor:pointer;background:rgba(6,10,48,.35)}
.mode:has(input:checked){border-color:var(--gold);background:rgba(248,208,72,.12)}
.mode input{margin-top:4px;accent-color:#f8d048}
.mode b{display:block;font-weight:400;font-size:16px;color:var(--ink)}
.mode span{font-size:13px;color:var(--dim);line-height:1.6}
.donate{grid-column:1/-1;background:#fbf6ea;color:#3a2d10;text-shadow:none;border:3px solid #b8913f;border-radius:4px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;font-size:15px;line-height:1.7}
.donate h3{margin:0;font-weight:400;font-size:18px;color:#7a1f2a}
.donate a{align-self:flex-start;font-family:var(--px);color:#fff;background:#0D4B3C;border:2px solid #3a2d10;border-radius:3px;padding:6px 14px;text-decoration:none}
.donate a:hover{background:#13654f}
.donate label{flex-direction:row!important;align-items:flex-start;gap:8px;color:#3a2d10!important;font-size:14px}
.donate label input{width:auto!important;margin-top:4px}
.donate .small{font-size:13px;color:#6b5a32}
.result{display:flex;flex-direction:column;gap:10px}
.result .cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:640px){.result .cards{grid-template-columns:1fr}}
.result canvas,.result img{width:100%;display:block;border-radius:3px;box-shadow:3px 4px 0 rgba(0,0,0,.4)}
.result .cap{font-size:14px;color:var(--gold);line-height:1.7}
.tv{background:#0a0a14;border:10px solid #2a2b40;border-radius:14px;box-shadow:inset 0 0 0 3px #000,0 0 0 3px #4a4c70;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;overflow:hidden;
  background-image:repeating-linear-gradient(180deg,rgba(255,255,255,.04) 0 1px,transparent 1px 3px),radial-gradient(circle at 50% 45%,#2c3a7a,#0a0a14 70%)}
.tv iframe{width:100%;height:100%;border:0;display:block}
.tvplay{display:flex;flex-direction:column;align-items:center;gap:14px;color:#fff;text-decoration:none;font-size:18px;text-shadow:2px 2px 0 #000}
.tvplay .tri{width:0;height:0;border-left:44px solid #e85a6a;border-top:28px solid transparent;border-bottom:28px solid transparent;filter:drop-shadow(4px 4px 0 #000)}
.tvplay:hover .tri{border-left-color:#ff7a88}
.tvplay:focus-visible{outline:3px solid var(--gold);outline-offset:6px}
.vinfo{display:flex;flex-direction:column;gap:8px}
.vinfo h3{margin:0;font-weight:400;font-size:clamp(17px,2.4vw,22px)}
.vinfo .sub{font-size:14px;color:var(--dim)}
.vinfo p{margin:0;font-size:15px;line-height:1.8}
.btnlink{font-family:var(--px);color:#fff;background:#c8304a;border:3px solid #f4f4f8;border-radius:4px;padding:6px 14px;text-decoration:none;text-shadow:none}
.btnlink.alt{background:#0D4B3C}
.btnlink:hover{filter:brightness(1.12)}
.mine{font-size:14px;color:var(--dim);line-height:1.7}
.mine li{overflow-wrap:anywhere}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap">
  <div class="screen" id="screen">
    <canvas id="game" width="320" height="240" aria-label="線上四維堂遊戲畫面"></canvas>
    <div class="crt" id="crt"></div>
    <div class="hud">
      <span class="chip win" id="loc">四維堂外</span>
      <span class="chip win" id="cnt">★ <b>0</b>/10</span>
    </div>
    <div class="loccard win" id="loccard" hidden></div>
    <div class="dlg win" id="dlg" hidden aria-live="polite"></div>
    <div class="title" id="title">
      <div class="eyebrow">NATIONAL CHENGCHI UNIVERSITY</div>
      <h1>線上四維堂</h1>
      <div class="sub">政大百年攝影展</div>
      <div class="menu win">
        <button class="sel" id="startBtn">開始參觀</button>
        <button id="howBtn">操作說明</button>
      </div>
      <div class="push">PUSH START</div>
      <div class="copy">© 1927–2027 NCCU 百年</div>
    </div>
  </div>

  <div class="bar">
    <div class="hint kb">移動 <kbd>↑↓←→</kbd> <kbd>WASD</kbd>　調查 <kbd>空白鍵</kbd> <kbd>Enter</kbd>　關閉 <kbd>Esc</kbd>　也可以點畫面走過去</div>
    <div class="toggles">
      <button class="tog win" id="sndBtn" aria-pressed="true">音效：開</button>
      <button class="tog win" id="crtBtn" aria-pressed="true">掃描線：開</button>
    </div>
    <div class="touch">
      <div class="pad">
        <button class="u" data-k="up" aria-label="上">▲</button>
        <button class="l" data-k="left" aria-label="左">◀</button>
        <button class="r" data-k="right" aria-label="右">▶</button>
        <button class="d" data-k="down" aria-label="下">▼</button>
      </div>
      <div class="ab"><button class="b" id="btnB" aria-label="B 關閉">B</button><button class="a" id="btnA" aria-label="A 互動">A</button></div>
    </div>
  </div>
  <p class="note">體驗原型：四維堂內外依實景繪製，展場中兩張為真實照片（提案人提供），其餘為像素示意圖。正式版換上校史館與校友授權的攝影作品。</p>
</div>

<div id="panel" hidden role="dialog" aria-modal="true" aria-labelledby="pTitle"><div class="pcard win" id="pcard"></div></div>

<div id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <div class="card win">
    <div class="frame" id="mFrame"></div>
    <div class="info">
      <div class="no" id="mNo"></div>
      <h2 id="mTitle"></h2>
      <div class="meta" id="mMeta"></div>
      <p id="mText"></p>
    </div>
    <div class="nav">
      <button id="prev">上一張</button>
      <button id="close">回到展場</button>
      <button id="next">下一張</button>
    </div>
  </div>
</div>

<script>
(()=>{
const W=320,H=240;
const cv=document.getElementById('game'),ctx=cv.getContext('2d');ctx.imageSmoothingEnabled=false;
const FONT="'DotGothic16','Courier New',monospace";
const OUT='#2b1a1c';

/* ================= helpers ================= */
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');g.imageSmoothingEnabled=false;return [c,g]};
const R=(g,x,y,w,h,c)=>{g.fillStyle=c;g.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))};
function rng(s){return()=>{s=(s*16807)%2147483647;return s/2147483647}}
function speck(g,x,y,w,h,cols,dens,seed){const r=rng(seed);const n=w*h*dens|0;for(let i=0;i<n;i++){g.fillStyle=cols[r()*cols.length|0];g.fillRect(x+(r()*w|0),y+(r()*h|0),1,1)}}
function dith(g,x,y,w,h,c){g.fillStyle=c;for(let j=0;j<h;j++)for(let i=(j&1);i<w;i+=2)g.fillRect(x+i,y+j,1,1)}
function disc(g,cx,cy,r,c){g.fillStyle=c;for(let y=-r;y<=r;y++){const w=Math.round(Math.sqrt(r*r-y*y));g.fillRect(Math.round(cx-w),Math.round(cy+y),w*2+1,1)}}
function ellipse(g,cx,cy,rx,ry,c){g.fillStyle=c;for(let y=-ry;y<=ry;y++){const w=Math.round(rx*Math.sqrt(1-(y*y)/(ry*ry)));g.fillRect(Math.round(cx-w),Math.round(cy+y),w*2+1,1)}}

function outline(c,col=OUT){const g=c.getContext('2d');const d=g.getImageData(0,0,c.width,c.height),p=d.data,w=c.width,h=c.height;const o=[];
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=(y*w+x)*4;if(p[i+3])continue;
    const n=(xx,yy)=>xx>=0&&yy>=0&&xx<w&&yy<h&&p[(yy*w+xx)*4+3]>0;if(n(x-1,y)||n(x+1,y)||n(x,y-1)||n(x,y+1))o.push(x,y)}
  g.fillStyle=col;for(let k=0;k<o.length;k+=2)g.fillRect(o[k],o[k+1],1,1);return c}

function blocked(x,y){const b=scene.bounds;if(x-5<b.x0||x+5>b.x1||y-4<b.y0||y>b.y1)return true;
 return scene.solids.some(s=>x+5>s.x&&x-5<s.x+s.w&&y>s.y&&y-4<s.y+s.h)}
function nearest(){let best=null,bd=1;scene.inter.forEach(o=>{if(!o.w&&!o.npcRef&&o.npcRef!==0)return;const ax=o.npcRef!=null?scene.npcs[o.npcRef].x:o.at.x,ay=o.npcRef!=null?scene.npcs[o.npcRef].y+10:o.at.y;
  const d=Math.hypot(ax-me.x,ay-me.y)/(o.rad||22);if(d<bd){bd=d;best=o}});return best}
function act(o){if(!o)return;
 if(o.go){hush();startFade(o.go);return}
 if(o.npcRef!=null){const n=scene.npcs[o.npcRef];n.dir=faceTo(n,me);say(n.say[0],n.say[1]);return}
 if(o.panel){hush();openPanel(o.panel);return}
 if(o.say){say(o.say[0],o.say[1]);return}
 if(o.photo!=null){hush();openModal(o.photo)}}
function faceTo(a,b){const dx=b.x-a.x,dy=b.y-a.y;return Math.abs(dx)>Math.abs(dy)?(dx<0?'left':'right'):(dy<0?'up':'down')}
function startFade(to){if(fadeTo)return;fadeTo=to;fade=.001;sfx.door()}

 else{me.x=240;me.y=210;me.dir='down';say('四維堂外','謝謝參觀！想再看一次，往上走回大門就能進去。')}}

let last=performance.now();
function tick(now){const dt=Math.min(.05,(now-last)/1000);last=now;
 if(started&&modalIdx<0&&!panelOpen&&!fadeTo){let dx=0,dy=0;
  if(keys.left)dx--;if(keys.right)dx++;if(keys.up)dy--;if(keys.down)dy++;
  if(dx||dy)target=null;
  if(target){const tx=target.x-me.x,ty=target.y-me.y;if(Math.abs(tx)>1.5)dx=Math.sign(tx);if(Math.abs(ty)>1.5)dy=Math.sign(ty);
   if(!dx&&!dy){const t=target.then;target=null;if(t)act(t)}}
  if(dx||dy){const sp=72*dt*(dx&&dy?.75:1);const ox=me.x,oy=me.y;
   if(!blocked(me.x+dx*sp,me.y))me.x+=dx*sp;if(!blocked(me.x,me.y+dy*sp))me.y+=dy*sp;
   if(target&&ox===me.x&&oy===me.y){const t=target.then;target=null;if(t&&Math.hypot(t.at.x-me.x,t.at.y-me.y)<40)act(t)}
   me.dir=Math.abs(dx)>=Math.abs(dy)&&dx?(dx<0?'left':'right'):(dy<0?'up':'down');me.anim+=dt*7;me.frame=Math.floor(me.anim)%2+1;
   if(!dlg.hidden&&!dlgT)hush()}else{me.frame=0;me.anim=0}
  if(scene===scenes.out&&me.y<=202&&me.x>200&&me.x<280&&keys.up)startFade('in');
  if(scene===scenes.in&&me.y>=593&&me.x>212&&me.x<268&&keys.down)startFade('out');
  scene.npcs.forEach(n=>{if(!n.path)return;n.t=(n.t||0)+dt;const [a,b]=n.path;const L=Math.hypot(b[0]-a[0],b[1]-a[1]);const per=L/n.speed;const ph=(n.t/per)%2;const k=ph<1?ph:2-ph;
    if(Math.hypot(me.x-n.x,me.y-n.y)<26){n.frame=0;return}
    const nx=a[0]+(b[0]-a[0])*k,ny=a[1]+(b[1]-a[1])*k;n.dir=ny>n.y?'down':'up';n.x=nx;n.y=ny;n.frame=Math.floor(n.t*6)%2+1})}
 if(fadeTo){fade+=dt*3;if(fade>=1&&fade<2){enter(fadeTo);fade=2}if(fade>=3){fade=0;fadeTo=null}}
 clouds.forEach(c=>{c.x+=c.s*dt;if(c.x>500)c.x=-60});
 draw(now);requestAnimationFrame(tick)}

 if(kind==='board')buildBoard();else if(kind==='guest')buildGuest();else if(kind==='video')buildVideo();else buildPost(kind);
 document.getElementById('pClose').onclick=closePanel;const f=pcard.querySelector('input,textarea');if(f)f.focus({preventScroll:true})}
function closePanel(){panel.hidden=true;panelOpen=null;sfx.close()}
panel.addEventListener('click',e=>{if(e.target===panel)closePanel()});

function buildBoard(){pcard.innerHTML=head('立式留言板','貼一張便利貼，留下你的看法或祝福。看展的人都看得到。')+
 `<div class="cork" id="cork" aria-live="polite"></div>
 <form class="f" id="nf"><label>暱稱<input id="nWho" maxlength="16" required placeholder="例如：小魚"></label>
 <label>系級或身分<input id="nDept" maxlength="24" required placeholder="例如：112 外交系、民國 72 年新聞系校友"></label>
 <div class="swatch" role="radiogroup" aria-label="便利貼顏色"><label><input type="radio" name="nc" value="y" checked>黃</label><label><input type="radio" name="nc" value="p">粉</label><label><input type="radio" name="nc" value="b">藍</label><label><input type="radio" name="nc" value="g">綠</label></div>
 <label class="wide">想說的話（120 字內）<textarea id="nMsg" maxlength="120" required placeholder="看完展覽的想法、對政大的祝福都可以"></textarea></label>
 <div class="wide" style="display:flex;gap:12px;align-items:center;flex-wrap:wrap"><button class="go" type="submit">貼上去</button><span class="msg" id="nMsgOut"></span></div></form>`;
 renderNotes();
 document.getElementById('nf').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('.go');b.disabled=true;
  const d={who:clip(nWho.value,16),dept:clip(nDept.value,24),msg:clip(nMsg.value,120),c:(e.target.querySelector('input[name=nc]:checked')||{}).value||'y',r:Math.round((Math.random()*5-2.5)*10)/10,ts:Date.now()};
  const r=await save('note',d);b.disabled=false;const out=document.getElementById('nMsgOut');
  if(r==='full'){out.textContent='留言板已經貼滿了，請通知展覽擁有者整理。';return}
  nMsg.value='';out.textContent=r==='shared'?'已貼上留言板！':LOCAL_MSG;renderNotes();sfx.ok()}}
function renderNotes(){const box=document.getElementById('cork');if(!box)return;box.innerHTML='';
 allNotes().forEach(n=>{const d=el('div','sticky c-'+(n.c||'y'));d.style.setProperty('--r',(n.r||0)+'deg');d.append(el('span',null,n.msg));const by=el('span','by','— '+n.dept+'｜'+n.who);if(n.sample)by.append(el('span','tag','示範'));d.append(by);box.append(d)})}

/* stage screen: the centennial film. Set EMBED_VIDEO to true once the page is hosted where YouTube can be embedded (e.g. the 百年校慶網站). */
const EMBED_VIDEO=true,VIDEO_ID='pDLcWlUSShk',VIDEO_URL='https://www.youtube.com/watch?v='+VIDEO_ID;
function buildVideo(){pcard.innerHTML=head('舞台放映','政大百年宣傳片')+
 `<div class="tv">${EMBED_VIDEO?`<iframe src="https://www.youtube-nocookie.com/embed/${VIDEO_ID}?autoplay=1" title="政因有您 百年為序 未來成詩（完整版）" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>`:
  `<a class="tvplay" href="${VIDEO_URL}" target="_blank" rel="noopener" aria-label="在 YouTube 播放影片"><span class="tri"></span><span>在 YouTube 播放</span></a>`}</div>
 <div class="vinfo"><h3>政因有您 百年為序 未來成詩（完整版）</h3>
 <div class="sub">國立政治大學 NCCU 官方頻道｜2025 年 11 月 6 日</div>
 <p>為迎接 2027 年百年校慶製作的形象影片，介紹百年薈萃基金要支持的方向，其中一項就是重現四維堂的歷史風貌。</p>
 <div style="display:flex;gap:12px;flex-wrap:wrap"><a class="btnlink" href="${VIDEO_URL}" target="_blank" rel="noopener">在 YouTube 觀看 ↗</a><a class="btnlink alt" href="https://donation.nccu.edu.tw/donate" target="_blank" rel="noopener">支持百年薈萃基金 ↗</a></div></div>`}
function buildGuest(){pcard.innerHTML=head('簽名簿','到此一遊，留下你的名字。')+
 `<div class="book"><ol id="gL"></ol><ol id="gR"></ol></div>
 <form class="f" id="gf"><label>名字或暱稱<input id="gWho" maxlength="16" required></label>
 <label>系級或身分<input id="gDept" maxlength="24" required placeholder="例如：113 日文系、校友、訪客"></label>
 <label>一句話（40 字內）<input id="gMsg" maxlength="40" placeholder="例如：生日快樂！"></label>
 <div><button class="go" type="submit">簽名</button></div><div class="wide msg" id="gOut"></div></form>`;
 renderSigns();
 document.getElementById('gf').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('.go');b.disabled=true;
  const d={who:clip(gWho.value,16),dept:clip(gDept.value,24),msg:clip(gMsg.value,40),ts:Date.now()};const r=await save('sign',d);b.disabled=false;
  const out=document.getElementById('gOut');if(r==='full'){out.textContent='簽名簿寫滿了，請通知展覽擁有者。';return}
  gMsg.value='';out.textContent=r==='shared'?'簽好了，謝謝你來看展！':LOCAL_MSG;renderSigns();sfx.ok()}}
function renderSigns(){const L=document.getElementById('gL'),Rr=document.getElementById('gR');if(!L)return;L.innerHTML='';Rr.innerHTML='';
 const list=allSigns();list.forEach((sg,i)=>{const li=el('li');li.append(el('span','n',sg.who),el('span','d',sg.dept),el('span',null,sg.msg||''));if(sg.sample)li.append(el('span','tag','示範'));(i<Math.ceil(list.length/2)?L:Rr).append(li)})}

function photoURL(p){if(p.img)return p.src;if(!p.url)p.url=p.pix.toDataURL();return p.url}
function wrapLines(g,text,maxW){const out=[];text.split('\n').forEach(par=>{let line='';for(const ch of par){const t=line+ch;if(g.measureText(t).width>maxW&&line){out.push(line);line=ch}else line=t}out.push(line)});return out}
function composeBack(d,red){const [c,g]=mk(600,400);g.imageSmoothingEnabled=true;
 g.fillStyle='#fbf6ea';g.fillRect(0,0,600,400);g.strokeStyle='#d8c9a4';g.lineWidth=2;g.strokeRect(10,10,580,380);
 g.strokeStyle='#c9b48c';g.beginPath();g.moveTo(330,40);g.lineTo(330,360);g.stroke();
 g.font="18px "+FONT;g.fillStyle='#2b2a5a';g.textBaseline='top';g.textAlign='left';
 const lines=wrapLines(g,d.body,280).slice(0,12);
 for(let i=0;i<12;i++){g.fillStyle='#e3d6b4';g.fillRect(30,58+i*25+22,280,1)}
 g.fillStyle='#2b2a5a';lines.forEach((l,i)=>g.fillText(l,30,58+i*25));
 g.font="14px "+FONT;g.fillStyle='#6b5a32';g.fillText(d.from?'寄件人：'+d.from:'',30,30);
 // stamp
 g.fillStyle='#fbf6ea';g.strokeStyle='#c8304a';g.setLineDash([4,3]);g.lineWidth=2;g.strokeRect(500,30,70,82);g.setLineDash([]);
 g.fillStyle='#0D4B3C';g.fillRect(506,36,58,70);g.fillStyle='#f8d048';g.font="26px "+FONT;g.textAlign='center';g.fillText('100',535,48);g.font="13px "+FONT;g.fillStyle='#fbf6ea';g.fillText('政大百年',535,82);
 // postmark
 g.save();g.translate(440,90);g.rotate(-0.25);g.strokeStyle='rgba(30,50,140,.8)';g.lineWidth=2;g.beginPath();g.arc(0,0,40,0,Math.PI*2);g.stroke();g.beginPath();g.arc(0,0,34,0,Math.PI*2);g.stroke();
 g.fillStyle='rgba(30,50,140,.85)';g.font="12px "+FONT;g.textAlign='center';g.fillText('政大四維堂',0,-20);g.fillText(d.online?'2027.05.20':'2027.05.20',0,-6);g.fillText(d.online?'線上投遞':'實體郵寄',0,8);g.restore();
 // address block
 g.textAlign='left';g.fillStyle='#2b2a5a';g.font="16px "+FONT;
 const rows=[ '收件人：'+d.to, ...(d.online?['Email：'+d.email]:wrapLines(g,'地址：'+d.addr,230)), red?('締約校：'+d.when.split('｜')[0]):('寄達：'+d.when)];
 let y=180;rows.forEach(r=>{wrapLines(g,r,230).forEach(l=>{g.fillText(l,350,y);g.fillStyle='#c9b48c';g.fillRect(350,y+22,230,1);g.fillStyle='#2b2a5a';y+=34})});
 g.font="11px "+FONT;g.fillStyle='#9a8a64';g.fillText('NCCU 100｜線上四維堂',350,366);return c}
function buildPost(kind){const red=kind==='red';
 pcard.innerHTML=head(red?'紅色郵筒｜寄到世界':'綠色郵筒｜寄給自己',red?'寫一張明信片給 2027 年同樣在過整十週年的締約校。':'挑一張照片當正面，寫給未來的自己。')+
 `<div class="pc"><div class="pcfront"><img id="pcImg" alt=""><div class="stamp"><b>100</b>政大<br>百年</div><div class="postmark" id="pm" hidden>政大四維堂<br>2027.05.20<br>已投遞</div></div>
 <form class="f" id="pf">
  <div class="wide modes" role="radiogroup" aria-label="寄送方式">
   <label class="mode"><input type="radio" name="mode" value="online" checked><div><b>線上明信片</b><span>你寫的字會印在明信片背面，寄到指定的 Email。</span></div></label>
   <label class="mode"><input type="radio" name="mode" value="paper"><div><b>實體明信片</b><span>為「四維堂風華再現計畫」捐款，金額不限，學校負擔郵資幫你寄出。</span></div></label>
  </div>
  <label class="wide">明信片正面<select id="pPhoto">${PHOTOS.map((p,i)=>`<option value="${i}">${String(i+1).padStart(2,'0')}　${p.t}</option>`).join('')}</select></label>
  ${red?`<label class="wide">寄給哪一所締約校<select id="pSchool">${SCHOOLS.map(s=>`<option>${s}</option>`).join('')}</select></label>`:`<label class="wide">什麼時候寄到<select id="pWhen"><option>一年後（2028 年 5 月 20 日）</option><option>我畢業的那一天</option><option>政大 110 週年（2037 年 5 月 20 日）</option></select></label>`}
  <label>收件人<input id="pTo" maxlength="30" required placeholder="${red?'例如：International Office':'例如：十年後的我'}"></label>
  <label>寄件人<input id="pFrom" maxlength="30" placeholder="你的名字與系級"></label>
  <label class="wide" id="wEmail">收件 Email<input id="pEmail" type="email" maxlength="80" placeholder="name@example.com"></label>
  <label class="wide" id="wAddr" hidden>郵寄地址<textarea id="pAddr" maxlength="120" rows="2" placeholder="${red?'對方學校的地址':'寄達時你可能住的地址'}"></textarea></label>
  <div class="donate" id="wDonate" hidden>
   <h3>支持四維堂風華再現計畫</h3>
   <div>實體明信片由學校負擔印製與郵資寄出。邀請你透過政大捐款平台，為「四維堂風華再現計畫」捐出任何金額，讓實體的四維堂也能像線上一樣重新亮起來。</div>
   <a href="https://donation.nccu.edu.tw/donate" target="_blank" rel="noopener">前往政大捐款平台 ↗</a>
   <label><input type="checkbox" id="pDonated">我已完成捐款（金額不限）</label>
   <label class="wide" style="flex-direction:column!important;align-items:stretch">捐款收據編號或捐款人姓名（選填，方便秘書處對帳）<input id="pReceipt" maxlength="40" style="width:100%!important"></label>
   <div class="small">捐款網址：donation.nccu.edu.tw/donate　｜　原型示範，正式版由秘書處核對捐款紀錄後寄出。</div>
  </div>
  <label class="wide">內容（200 字內，會印在明信片背面）<textarea id="pBody" maxlength="200" required rows="4"></textarea></label>
  <div class="wide" style="display:flex;gap:12px;align-items:center;flex-wrap:wrap"><button class="go" type="submit" id="pGo">寄出線上明信片</button><span class="msg" id="pOut"></span></div>
 </form></div><div class="result" id="pRes" hidden></div><div class="mine" id="mine"></div>`;
 const sel=document.getElementById('pPhoto');const first=[...seen][0];sel.value=first!=null?first:0;
 const upd=()=>{const p=PHOTOS[+sel.value];const im=document.getElementById('pcImg');im.src=photoURL(p);im.alt='明信片正面：'+p.t;im.className=p.img?'':'px';document.getElementById('pm').hidden=true};upd();sel.onchange=upd;
 const setMode=()=>{const online=pcard.querySelector('input[name=mode]:checked').value==='online';
   document.getElementById('wEmail').hidden=!online;document.getElementById('pEmail').required=online;
   document.getElementById('wAddr').hidden=online;document.getElementById('pAddr').required=!online;
   document.getElementById('wDonate').hidden=online;document.getElementById('pDonated').required=!online;
   document.getElementById('pGo').textContent=online?'寄出線上明信片':'投進郵筒（實體寄送）'};
 pcard.querySelectorAll('input[name=mode]').forEach(r=>r.onchange=setMode);setMode();
 if(red){const sc=document.getElementById('pSchool');const fill=()=>{const name=sc.value.split('（')[0];const a=document.getElementById('pAddr');if(!a.dataset.touched)a.value=name+' 國際事務處 收';};fill();sc.onchange=fill;document.getElementById('pAddr').oninput=e=>e.target.dataset.touched=1}
 renderMine();
 document.getElementById('pf').onsubmit=async e=>{e.preventDefault();const b=document.getElementById('pGo');b.disabled=true;
  const online=pcard.querySelector('input[name=mode]:checked').value==='online';
  const d={kind,online,photo:+sel.value,to:clip(pTo.value,30),from:clip(pFrom.value,30),body:clip(pBody.value,200),when:red?clip(pSchool.value,40):clip(pWhen.value,40),ts:Date.now()};
  if(online)d.email=clip(pEmail.value,80);else{d.addr=clip(pAddr.value,120);d.donated=true;d.receipt=clip(pReceipt.value,40)}
  const r=await save('card',d);b.disabled=false;document.getElementById('pm').hidden=false;sfx.door();
  const res=document.getElementById('pRes');res.hidden=false;res.innerHTML='';
  const cap=el('div','cap',r==='full'?'郵筒滿了，請通知展覽擁有者。':online?('線上明信片完成！正式版會寄到 '+d.email+(red?'':'，並在「'+d.when+'」送達')+'。'):('謝謝你支持四維堂風華再現計畫！實體明信片將由學校寄到你填的地址'+(red?'（'+d.when.split('｜')[0]+'）':'')+'。'));
  const cards=el('div','cards');const front=document.createElement('img');front.src=photoURL(PHOTOS[d.photo]);front.alt='明信片正面';if(!PHOTOS[d.photo].img)front.style.imageRendering='pixelated';
  const back=composeBack(d,red);back.setAttribute('role','img');back.setAttribute('aria-label','明信片背面，印著你寫的內容');cards.append(front,back);
  res.append(cap,cards,el('div','small','（原型示範，不會真的寄出。）'));res.scrollIntoView({behavior:'smooth',block:'nearest'});
  pBody.value='';renderMine()}}
function renderMine(){const m=document.getElementById('mine');if(!m)return;m.innerHTML='';if(!myCards.length)return;
 m.append(el('div',null,'你已經寄出 '+myCards.length+' 張明信片（只有你看得到）：'));const ul=el('ul');
 myCards.slice(0,5).forEach(c=>{const p=PHOTOS[c.photo]||PHOTOS[0];ul.append(el('li',null,(c.kind==='red'?'寄到世界｜':'寄給自己｜')+(c.online?'線上｜':'實體｜')+'正面「'+p.t+'」→ '+(c.to||'')+'，'+(c.when||'')))});m.append(ul)}

/* ================= input ================= */
const KM={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right'};
function begin(){if(started)return;started=true;sfx.ok();document.getElementById('title').hidden=true;locCard('四維堂前廣場');say('四維堂外','早安！陽光正照在四維堂上。\n往上走進大門參觀百年攝影展，左邊的告示板也可以看看。')}
document.getElementById('title').addEventListener('click',e=>{if(e.target.id==='howBtn')return;begin()});
document.getElementById('howBtn').addEventListener('click',()=>{begin();say('操作說明','方向鍵或 WASD 走路，也可以直接點畫面。\n靠近照片或人按空白鍵調查，點照片會直接放大。')});
const sndBtn=document.getElementById('sndBtn'),crtBtn=document.getElementById('crtBtn');
sndBtn.onclick=()=>{sound=!sound;sndBtn.textContent='音效：'+(sound?'開':'關');sndBtn.setAttribute('aria-pressed',sound)};
crtBtn.onclick=()=>{const c=document.getElementById('crt');c.hidden=!c.hidden;crtBtn.textContent='掃描線：'+(c.hidden?'關':'開');crtBtn.setAttribute('aria-pressed',!c.hidden)};
addEventListener('keydown',e=>{
 if(panelOpen){if(e.code==='Escape'){closePanel();e.preventDefault()}return}
 if(!started){if(['Space','Enter'].includes(e.code)||KM[e.code]){begin();e.preventDefault()}return}
 if(modalIdx>=0){if(e.code==='Escape'||e.code==='KeyX'){closeModal();e.preventDefault()}else if(e.code==='ArrowLeft'){openModal(modalIdx-1);e.preventDefault()}else if(e.code==='ArrowRight'){openModal(modalIdx+1);e.preventDefault()}return}
 if(KM[e.code]){keys[KM[e.code]]=true;e.preventDefault()}
 if(e.code==='Space'||e.code==='Enter'||e.code==='KeyZ'){const n=nearest();if(n)act(n);else hush();e.preventDefault()}
 if(e.code==='Escape')hush()});
addEventListener('keyup',e=>{if(KM[e.code])keys[KM[e.code]]=false});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false});
document.querySelectorAll('.pad button').forEach(b=>{const k=b.dataset.k;const on=e=>{e.preventDefault();begin();keys[k]=true;b.classList.add('on')},off=()=>{keys[k]=false;b.classList.remove('on')};
 b.addEventListener('pointerdown',on);['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,off))});
document.getElementById('btnA').addEventListener('click',()=>{if(!started)return begin();if(modalIdx>=0)return openModal(modalIdx+1);const n=nearest();n?act(n):hush()});
document.getElementById('btnB').addEventListener('click',()=>{modalIdx>=0?closeModal():hush()});
cv.addEventListener('click',e=>{if(!started||fadeTo)return;const r=cv.getBoundingClientRect();const x=(e.clientX-r.left)*W/r.width+cam.x,y=(e.clientY-r.top)*H/r.height+cam.y;
 const o=scene.inter.find(o=>o.w&&x>=o.x&&x<=o.x+o.w&&y>=o.y&&y<=o.y+o.h);
 if(o){if(o.photo!=null){hush();openModal(o.photo);return}if(o.panel){hush();openPanel(o.panel);return}target={x:o.at.x,y:o.at.y,then:o};return}
 const n=scene.npcs.find(n=>Math.abs(n.x-x)<10&&y<n.y+2&&y>n.y-20);if(n){const idx=scene.npcs.indexOf(n);const io=scene.inter.find(i=>i.npcRef===idx);target={x:n.x,y:n.y+12,then:{...io,at:{x:n.x,y:n.y+12}}};return}
 hush();target={x,y:Math.max(scene.bounds.y0+4,y)}});

const fontReady=document.fonts&&document.fonts.load?Promise.race([document.fonts.load("13px 'DotGothic16'"),new Promise(r=>setTimeout(r,1500))]):Promise.resolve();
Promise.all([fontReady,...loads]).finally(()=>{paintExterior();paintBuilding();paintInterior();requestAnimationFrame(tick)});
})();
</script>
